<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Jardim IA 🌿</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  transition: 0.3s;
}

body.dark {
  background: #0b2e22;
  color: white;
}

body.light {
  background: #e9f5ee;
  color: #111;
}

.container {
  max-width: 850px;
  margin: auto;
  padding: 20px;
  text-align: center;
}

.chat {
  height: 420px;
  overflow-y: auto;
  padding: 10px;
  border-radius: 12px;
  background: rgba(0,0,0,0.1);
  text-align: left;
}

.msg {
  padding: 10px;
  margin: 8px;
  border-radius: 10px;
  max-width: 80%;
}

.user {
  background: #2ecc71;
  color: black;
  margin-left: auto;
  text-align: right;
}

.ia {
  background: #1abc9c;
  margin-right: auto;
}

.input-area {
  display: flex;
  gap: 5px;
  margin-top: 10px;
}

input {
  flex: 1;
  padding: 10px;
  border-radius: 8px;
  border: none;
  outline: none;
}

button {
  padding: 10px 15px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  background: #16a085;
  color: white;
}

button:hover {
  background: #138d75;
}

.preview {
  max-width: 200px;
  margin-top: 10px;
  border-radius: 10px;
}
</style>
</head>

<body class="dark">

<div class="container">

<h1>🌿 Jardim IA da Mamãe</h1>

<button onclick="toggleTheme()">🌙 / ☀️ Tema</button>

<div class="chat" id="chat">
  <div class="msg ia">🌱 Olá! Pergunte ou envie uma foto de planta 📸</div>
</div>

<input type="file" id="file" accept="image/*" onchange="previewImage(event)">
<br>
<img id="preview" class="preview">

<div class="input-area">
  <input id="text" placeholder="Pergunte sobre plantas...">
  <button onclick="enviar()">Enviar</button>
</div>

</div>

<script>
const API_KEY = "SUA_NOVA_CHAVE_AQUI";

let imageBase64 = null;

// 🌙 tema
function toggleTheme(){
  document.body.classList.toggle("dark");
  document.body.classList.toggle("light");
}

// 📸 imagem
function previewImage(event){
  const file = event.target.files[0];
  const reader = new FileReader();

  reader.onload = function(){
    imageBase64 = reader.result; // já vem em base64 correto
    document.getElementById("preview").src = imageBase64;
  };

  reader.readAsDataURL(file);
}

// 🤖 enviar
async function enviar(){
  const text = document.getElementById("text").value;
  const chat = document.getElementById("chat");

  if(!text && !imageBase64) return;

  chat.innerHTML += `<div class="msg user">${text || "📸 imagem enviada"}</div>`;
  document.getElementById("text").value = "";

  const loading = document.createElement("div");
  loading.className = "msg ia";
  loading.innerText = "🌿 analisando...";
  chat.appendChild(loading);

  let content;

  // 📸 com imagem
  if(imageBase64){
    content = [
      {
        type: "input_text",
        text: text || "Analise essa planta e diga o que é e como cuidar."
      },
      {
        type: "input_image",
        image_url: imageBase64
      }
    ];
  } 
  // 💬 só texto
  else {
    content = [
      {
        type: "input_text",
        text: text
      }
    ];
  }

  try {
    const response = await fetch("https://api.openai.com/v1/responses", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `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}`
      },
      body: JSON.stringify({
        model: "gpt-4o-mini",
        input: [
          {
            role: "user",
            content: content
          }
        ]
      })
    });

    const data = await response.json();

    loading.remove();

    const resposta =
      data.output?.[0]?.content?.[0]?.text ||
      "Não consegui analisar 😢";

    chat.innerHTML += `<div class="msg ia">${resposta}</div>`;
    chat.scrollTop = chat.scrollHeight;

  } catch (err) {
    loading.remove();
    chat.innerHTML += `<div class="msg ia">❌ erro na IA</div>`;
  }

  imageBase64 = null;
  document.getElementById("preview").src = "";
}
</script>

</body>
</html>
