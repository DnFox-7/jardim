<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Jardim IA 🌿</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  transition: 0.3s;
}

/* 🌙 temas */
body.dark {
  background: #0b2e22;
  color: white;
}

body.light {
  background: #e9f5ee;
  color: #111;
}

.container {
  max-width: 850px;
  margin: auto;
  padding: 20px;
  text-align: center;
}

h1 {
  margin-bottom: 5px;
}

.chat {
  height: 420px;
  overflow-y: auto;
  padding: 10px;
  border-radius: 12px;
  background: rgba(0,0,0,0.1);
  text-align: left;
}

.msg {
  padding: 10px;
  margin: 8px;
  border-radius: 10px;
  max-width: 80%;
  line-height: 1.4;
}

.user {
  background: #2ecc71;
  color: black;
  margin-left: auto;
  text-align: right;
}

.ia {
  background: #1abc9c;
  margin-right: auto;
}

.input-area {
  display: flex;
  gap: 5px;
  margin-top: 10px;
}

input {
  flex: 1;
  padding: 10px;
  border-radius: 8px;
  border: none;
  outline: none;
}

button {
  padding: 10px 15px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  background: #16a085;
  color: white;
}

button:hover {
  background: #138d75;
}

.preview {
  max-width: 200px;
  margin-top: 10px;
  border-radius: 10px;
}
</style>
</head>

<body class="dark">

<div class="container">

<h1>🌿 Jardim IA da Mamãe</h1>

<button onclick="toggleTheme()">🌙 / ☀️ Tema</button>

<div class="chat" id="chat">
  <div class="msg ia">🌱 Olá! Envie uma pergunta ou uma foto de planta 📸</div>
</div>

<!-- FOTO -->
<input type="file" id="file" accept="image/*" onchange="previewImage(event)">
<br>
<img id="preview" class="preview">

<!-- INPUT -->
<div class="input-area">
  <input id="text" placeholder="Pergunte ou descreva a planta...">
  <button onclick="enviar()">Enviar</button>
</div>

</div>

<script>
const API_KEY = "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"; 

let imageBase64 = null;

// 🌙 tema
function toggleTheme(){
  document.body.classList.toggle("dark");
  document.body.classList.toggle("light");
}

// 📸 preview imagem
function previewImage(event){
  const file = event.target.files[0];
  const reader = new FileReader();

  reader.onload = function(){
    imageBase64 = reader.result;
    document.getElementById("preview").src = imageBase64;
  }

  reader.readAsDataURL(file);
}

// 🤖 enviar para IA
async function enviar(){
  const text = document.getElementById("text").value;
  const chat = document.getElementById("chat");

  if(!text && !imageBase64) return;

  chat.innerHTML += `<div class="msg user">${text || "📸 Imagem enviada"}</div>`;
  document.getElementById("text").value = "";

  chat.innerHTML += `<div class="msg ia">🌿 analisando...</div>`;

  let content;

  // 📸 COM IMAGEM
  if(imageBase64){
    content = [
      {
        type: "text",
        text: text || "Analise essa planta e me diga o que é e como cuidar."
      },
      {
        type: "image_url",
        image_url: {
          url: imageBase64
        }
      }
    ];
  } 
  // 💬 SÓ TEXTO
  else {
    content = text;
  }

  const response = await fetch("https://api.openai.com/v1/chat/completions", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": `Bearer ${API_KEY}`
    },
    body: JSON.stringify({
      model: "gpt-4o",
      messages: [
        {
          role: "system",
          content: "Você é um jardineiro especialista em plantas. Responda com carinho, simplicidade e dicas práticas."
        },
        {
          role: "user",
          content: content
        }
      ]
    })
  });

  const data = await response.json();

  const resposta = data.choices?.[0]?.message?.content || "Erro ao responder 😢";

  chat.innerHTML += `<div class="msg ia">${resposta}</div>`;

  imageBase64 = null;
  document.getElementById("preview").src = "";
}
</script>

</body>
</html>
