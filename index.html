<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para a Melhor Mãe do Mundo</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --cor-principal: #ff4d6d;
            --cor-secundaria: #ff758f;
            --cor-fundo: #fff0f3;
        }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(-45deg, #fff0f3, #ffccd5, #fff0f3, #ffb3c1);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #444;
            overflow-x: hidden;
            min-height: 100vh;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- PRELOADER --- */
        #preloader {
            position: fixed;
            inset: 0;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            transition: opacity 1s ease;
        }

        .foto-central {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 5px solid var(--cor-principal);
            object-fit: cover;
            display: none;
            box-shadow: 0 0 50px rgba(255, 77, 109, 0.4);
            animation: pulse-photo 2s infinite;
        }

        @keyframes pulse-photo {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        #btn-iniciar {
            padding: 20px 50px;
            font-size: 1.4rem;
            font-weight: 600;
            background: var(--cor-principal);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(255, 77, 109, 0.3);
            transition: 0.3s;
        }

        #btn-iniciar:hover { transform: scale(1.1); background: var(--cor-secundaria); }

        .barra-container {
            width: 280px;
            height: 12px;
            background: #eee;
            border-radius: 10px;
            margin-top: 30px;
            display: none;
            overflow: hidden;
            border: 2px solid #fff;
        }

        .barra-progresso {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--cor-principal), var(--cor-secundaria));
            transition: width 0.1s linear;
        }

        /* --- MURAL --- */
        #conteudo {
            display: none;
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(2.5rem, 8vw, 4rem);
            color: var(--cor-principal);
            text-align: center;
            margin-bottom: 40px;
        }

        .mural {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .item-mural {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            transition: 0.4s;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .item-mural:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 40px rgba(255, 77, 109, 0.2);
        }

        .item-mural img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-radius: 15px;
        }

        .frase {
            font-family: 'Dancing Script', cursive;
            font-size: 1.8rem;
            margin-top: 15px;
            color: #d63384;
            text-align: center;
        }

        .heart-particle {
            position: fixed;
            pointer-events: none;
            z-index: 1500;
            animation: fallAndFade linear forwards;
        }

        @keyframes fallAndFade {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <audio id="musica-fundo" src="msc/mae.mp3" preload="auto" loop></audio>

    <div id="preloader">
        <button id="btn-iniciar">Abrir Presente ❤️</button>
        
        <img src="img/paty00.jpeg" class="foto-central" id="foto-pre">
        
        <div class="barra-container" id="barra-box">
            <div class="barra-progresso" id="minha-barra"></div>
        </div>
        
        <p id="status-text" style="display:none; color: var(--cor-principal); margin-top: 15px; font-weight: 600; font-size: 1.1rem;"></p>
    </div>

    <div id="conteudo">
        <h1>Você é única, Mami!</h1>
        <div class="mural">
            <div class="item-mural"><img src="img/paty4.jpeg"><p class="frase">"Seu sorriso ilumina tudo!"</p></div>
            <div class="item-mural"><img src="img/paty5.jpeg"><p class="frase">"Minha rainha!"</p></div>
            <div class="item-mural"><img src="img/paty3.jpeg"><p class="frase">"Amor infinito!"</p></div>
            <div class="item-mural"><img src="img/paty.jpeg"><p class="frase">"Obrigado por tudo!"</p></div>
            <div class="item-mural"><img src="img/paty2.JPG"><p class="frase">"Amor que não se mede!"</p></div>
            <div class="item-mural"><img src="img/paty6.jpeg"><p class="frase">"Nossa maior inspiração!"</p></div>
        </div>
        <footer style="text-align: center; margin: 80px 0; color: #ff8fa3; font-weight: bold;">
            Feito com todo amor do mundo ❤️
        </footer>
    </div>

    <script>
        const btn = document.getElementById('btn-iniciar');
        const barra = document.getElementById('minha-barra');
        const barraBox = document.getElementById('barra-box');
        const statusText = document.getElementById('status-text');
        const musica = document.getElementById('musica-fundo');
        const preloader = document.getElementById('preloader');
        const conteudo = document.getElementById('conteudo');
        
        const mensagens = [
            "Buscando momentos especiais...",
            "Lembrando do seu carinho...",
            "Organizando as memórias...",
            "Você merece o mundo...",
            "Quase pronto, Mamãe..."
        ];

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-particle');
            const icons = ['❤️', '💖', '✨', '🌸', '💘'];
            heart.innerHTML = icons[Math.floor(Math.random() * icons.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
            heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 6000);
        }

        btn.addEventListener('click', () => {
            // Tenta dar o play e trata erro caso o arquivo não exista ou o navegador bloqueie
            musica.play().catch(error => {
                console.log("Erro ao tocar música. Verifique o caminho do arquivo: ", error);
            });

            btn.style.display = 'none';
            document.getElementById('foto-pre').style.display = 'block';
            barraBox.style.display = 'block';
            statusText.style.display = 'block';

            let tempoTotal = 30000; // 30 segundos de carregamento "fake"
            let progresso = 0;
            let intervalo = 100; 

            const timer = setInterval(() => {
                progresso += (intervalo / tempoTotal) * 100;
                barra.style.width = progresso + '%';

                let msgIndex = Math.floor((progresso / 100) * mensagens.length);
                if(mensagens[msgIndex]) statusText.innerText = mensagens[msgIndex];

                if(Math.random() > 0.7) createHeart();

                if (progresso >= 100) {
                    clearInterval(timer);
                    preloader.style.opacity = '0';
                    
                    setTimeout(() => {
                        preloader.style.display = 'none';
                        conteudo.style.display = 'block';
                        setTimeout(() => conteudo.style.opacity = '1', 50);
                        setInterval(createHeart, 400);
                    }, 1000);
                }
            }, intervalo);
        });
    </script>
</body>
</html>
