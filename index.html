<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para a Melhor Mãe do Mundo</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --cor-principal: #ff4d6d;
            --cor-secundaria: #ff758f;
            --cor-fundo: #fff0f3;
        }

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(-45deg, #fff0f3, #ffccd5, #fff0f3, #ffb3c1);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #444;
            overflow-x: hidden;
            min-height: 100vh;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- PRELOADER --- */
        #preloader {
            position: fixed;
            inset: 0;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .foto-central {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 5px solid var(--cor-principal);
            object-fit: cover;
            display: none;
            box-shadow: 0 0 30px rgba(255, 77, 109, 0.5);
            animation: floating 3s ease-in-out infinite;
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        #btn-iniciar {
            padding: 20px 50px;
            font-size: 1.4rem;
            font-weight: 600;
            background: var(--cor-principal);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(255, 77, 109, 0.3);
            transition: 0.3s;
            z-index: 2001;
        }

        #btn-iniciar:hover { transform: scale(1.1); background: #ff3355; }

        /* --- MURAL --- */
        #conteudo {
            display: none;
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
            perspective: 1000px; /* Para o efeito 3D */
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(2.5rem, 8vw, 4rem);
            color: var(--cor-principal);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            margin-bottom: 40px;
        }

        .mural {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
            padding: 20px;
        }

        .item-mural {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            transform-style: preserve-3d;
        }

        /* Efeito de inclinação ao passar o mouse */
        .item-mural:hover {
            transform: rotateX(5deg) rotateY(5deg) translateY(-10px);
            background: rgba(255, 255, 255, 0.9);
        }

        .item-mural img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .frase {
            font-family: 'Dancing Script', cursive;
            font-size: 1.6rem;
            margin-top: 20px;
            color: #d63384;
        }

        /* --- CORAÇÕES --- */
        .heart-particle {
            position: fixed;
            pointer-events: none;
            z-index: 1500;
            animation: fallAndFade linear forwards;
        }

        @keyframes fallAndFade {
            0% { transform: translateY(-10vh) rotate(0deg) scale(1); opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg) scale(0.5); opacity: 0; }
        }

        .barra-container {
            width: 250px;
            height: 8px;
            background: #eee;
            border-radius: 10px;
            margin-top: 30px;
            display: none;
            overflow: hidden;
        }

        .barra-progresso {
            width: 0%;
            height: 100%;
            background: var(--cor-principal);
            box-shadow: 0 0 10px var(--cor-principal);
        }
    </style>
</head>
<body>

    <div id="preloader">
        <button id="btn-iniciar">Abrir Presente ❤️</button>
        <img src="img/paty1.jpeg" class="foto-central" id="foto-pre">
        <div class="barra-container" id="barra-box">
            <div class="barra-progresso" id="minha-barra"></div>
        </div>
        <p id="status-text" style="display:none; color: var(--cor-principal); margin-top: 15px; font-weight: bold;">Carregando amor...</p>
    </div>

    <div id="conteudo">
        <center>
            <h1 id="titulo-principal">Você é única, Mami!</h1>
        </center>

        <div class="mural">
            
            <div class="item-mural">
                <img src="img/paty4.jpeg" alt="Momento 1">
                <p class="frase">"Seu sorriso ilumina tudo!"</p>
            </div>
            <div class="item-mural">
                <img src="img/paty5.jpeg" alt="Momento 2">
                <p class="frase">"Minha rainha!"</p>
            </div>
            <div class="item-mural">
                <img src="img/paty3.jpeg" alt="Momento 3">
                <p class="frase">"Amor infinito!"</p>
            </div>
            <div class="item-mural">
                <img src="img/paty.jpeg" alt="Momento 4">
                <p class="frase">"Obrigado por tudo!"</p>
            </div>
            <div class="item-mural">
                <img src="img/paty2.JPG" alt="Momento 4">
                <p class="frase">"Amor que não se mede!"</p>
            </div>
            <div class="item-mural">
                <img src="img/paty6.jpeg" alt="Momento 4">
                <p class="frase">"Nossa maior inspiração!"</p>
            </div>
        </div>
        
        <footer style="text-align: center; margin-top: 60px; padding-bottom: 40px; color: #ff8fa3;">
            Com todo o amor dos seasu filhos ❤️
        </footer>
    </div>

    <script>
        const btn = document.getElementById('btn-iniciar');
        const barra = document.getElementById('minha-barra');
        const fotoPre = document.getElementById('foto-pre');
        const barraBox = document.getElementById('barra-box');
        const preloader = document.getElementById('preloader');
        const conteudo = document.getElementById('conteudo');

        // Função para criar chuva de corações realistas
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-particle');
            
            // Variedade de corações
            const icons = ['❤️', '💖', '✨', '🌸', '💘'];
            heart.innerHTML = icons[Math.floor(Math.random() * icons.length)];
            
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
            heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
            heart.style.opacity = Math.random();
            
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 7000);
        }

        btn.addEventListener('click', () => {
            btn.style.display = 'none';
            fotoPre.style.display = 'block';
            barraBox.style.display = 'block';
            document.getElementById('status-text').style.display = 'block';

            let progresso = 0;
            const intervalo = setInterval(() => {
                progresso += 2;
                barra.style.width = progresso + '%';

                if (progresso >= 100) {
                    clearInterval(intervalo);
                    
                    preloader.style.transition = 'opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1)';
                    preloader.style.opacity = '0';
                    
                    setTimeout(() => {
                        preloader.style.display = 'none';
                        conteudo.style.display = 'block';
                        
                        // Inicia a chuva de corações infinita
                        setInterval(createHeart, 400);
                    }, 1500);
                }
            }, 60);
        });
    </script>
</body>
</html>
